# ==============================================================================
# EduPulse ERP Monorepo - Render.com Cloud Infrastructure-as-Code (IaC)
# ==============================================================================

databases:
  - name: edupulse-postgres
    databaseName: edupulse_db
    user: edupulse_user
    region: oregon
    plan: starter
    ipAllowList: []

services:
  - type: redis
    name: edupulse-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: edupulse-backend
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: PORT
        value: 8081
      - key: DATABASE_URL
        fromDatabase:
          name: edupulse-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: edupulse-postgres
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: edupulse-postgres
          property: user
      - key: DB_PASS
        fromDatabase:
          name: edupulse-postgres
          property: password
      - key: REDIS_URL
        fromService:
          type: redis
          name: edupulse-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: edupulse-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: edupulse-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 900000
      - key: JWT_REFRESH_EXPIRATION
        value: 604800000
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: APP_STORAGE_DOCUMENT_DIR
        value: /var/lib/edupulse/uploads

  - type: static
    name: edupulse-frontend
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: edupulse-backend
          envVarKey: RENDER_EXTERNAL_URL
